<div [formGroup]="parentForm" class="course-details-card">
  <div class="card-header">
    <h2 class="card-title">Información del Curso</h2>
    <p class="card-subtitle">
      Define el título, la descripción general y la imagen de portada.
    </p>
  </div>

  <div class="form-body">
    <div class="field-group">
      <label class="field-label"
        >Título del Curso <span class="required">*</span></label
      >
      <input
        type="text"
        formControlName="title"
        placeholder="Ej. Curso de Sostenibilidad y Cuidado Ambiental"
        class="custom-input"
      />
    </div>

    <div class="field-group">
      <label class="field-label">Descripción del Curso</label>
      <textarea
        formControlName="description"
        rows="4"
        placeholder="Escribe una breve presentación sobre el contenido..."
        class="custom-textarea"
      ></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">Enlace de Imagen de Portada (URL)</label>
      <div class="input-with-icon">
        <mat-icon class="input-icon">link</mat-icon>
        <input
          type="url"
          formControlName="imageUrl"
          placeholder="https://ejemplo.com/portada.jpg"
          class="custom-input icon-padding"
        />
      </div>
      <span class="field-hint"
        >Pega el enlace directo a una imagen alojada en la web.</span
      >
    </div>
  </div>
</div>
