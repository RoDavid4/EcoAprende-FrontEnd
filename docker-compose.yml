services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoaprende-frontend
    restart: always
    ports:
      - "4200:4200"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm start"
